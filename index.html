<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tải video TikTok</title>
</head>

<body style="text-align:center;font-family:sans-serif;">
  <h2>Tải video TikTok không logo</h2>

  <input id="link" placeholder="Dán link TikTok..." style="width:80%;padding:10px;">
  <br><br>

  <button onclick="download()" style="padding:10px 20px;">Tải</button>

  <div id="result"></div>

  <script>
    async function download() {
      let url = document.getElementById("link").value;

      let res = await fetch("https://tikwm.com/api/?url=" + url);
      let data = await res.json();

      if(data.data) {
        document.getElementById("result").innerHTML =
          "<br><video src='"+data.data.play+"' controls width='300'></video><br><a href='"+data.data.play+"' download>Tải video</a>";
      } else {
        alert("Lỗi rồi!");
      }
    }
  </script>
</body>
</html>
